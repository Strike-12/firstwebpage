<!DOCTYPE html>
<html lang="en">

    <title>My First Webpage</title>
    <style>
        body {
            background-color: #89CFF0;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: purple;
            margin: 0 0 8px;
        }

        p {
            color: #FF69B4;
            margin: 0;
        }

        a {
            color: #FF69B4;
        }

        .image-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
        }

        .profile-image {
            display: block;
            width: min(280px, 38vw);
            max-height: 34vh;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <main>
        <h1>elsen keena</h1>

        <div class="image-row">
